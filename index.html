<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pro Karaoke App - Sync Maker</title>
<link href="https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0F172A;
    --surface: #1E293B;
    --primary: #38BDF8;
    --text: #F8FAFC;
    --text-muted: #94A3B8;
    --radius: 16px;
  }
  body {
    background-color: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
    margin: 0;
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }
  .container { width: 100%; max-width: 500px; }
  .card {
    background: var(--surface);
    padding: 24px;
    border-radius: var(--radius);
    margin-bottom: 20px;
    box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3);
  }
  h1 { font-size: 22px; color: var(--primary); text-align: center; margin-top: 0; }
  
  input[type="file"], input[type="text"], textarea {
    width: 100%; padding: 14px; background: #0F172A; border: 1px solid #334155;
    color: white; border-radius: 10px; margin-top: 8px; box-sizing: border-box;
    font-family: inherit;
  }
  
  textarea { resize: vertical; min-height: 150px; }

  button {
    width: 100%; padding: 14px; background: var(--primary); color: #000;
    font-weight: bold; font-size: 16px; border: none; border-radius: 10px;
    margin-top: 16px; cursor: pointer; transition: 0.2s;
  }
  button:active { transform: scale(0.97); }
  button:disabled { background: #334155; color: #94A3B8; cursor: not-allowed; }
  .btn-outline { background: transparent; border: 1px solid var(--primary); color: var(--primary); }

  .progress-container { display: none; margin-top: 16px; text-align: center; }
  .progress-bar-bg { background: #334155; border-radius: 8px; height: 10px; width: 100%; overflow: hidden; margin-top: 8px; }
  .progress-bar-fill { background: var(--primary); height: 100%; width: 0%; transition: width 0.3s; }
  .progress-text { font-size: 14px; color: var(--primary); font-weight: bold; margin-top: 8px;}

  .song-list { list-style: none; padding: 0; margin: 0; }
  .song-item {
    background: #0F172A; padding: 16px; border-radius: 10px; margin-bottom: 10px;
    display: flex; justify-content: space-between; align-items: center; border: 1px solid #334155;
    flex-wrap: wrap; gap: 10px;
  }
  .song-title { font-weight: bold; font-size: 15px; width: 100%; }
  .song-actions { display: flex; gap: 5px; width: 100%; justify-content: flex-end; flex-wrap: wrap; }
  .song-actions button { width: auto; padding: 8px 12px; margin: 0; font-size: 13px; flex: 1; min-width: 60px; }

  #playerHeader { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 10px; }
  #playerHeader button { width: auto; padding: 8px 12px; margin: 0; font-size: 13px; }
  
  audio { width: 100%; margin-top: 16px; border-radius: 8px; }
  
  .karaoke-container {
    background: linear-gradient(145deg, #0f172a, #000000);
    height: 400px; overflow-y: auto; border-radius: 12px;
    padding: 30px 20px; text-align: center; margin-top: 16px; 
    border: 1px solid #334155; box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
    position: relative; scroll-behavior: smooth;
    font-family: 'Anek Malayalam', sans-serif;
  }
  
  .karaoke-container::-webkit-scrollbar { width: 5px; }
  .karaoke-container::-webkit-scrollbar-thumb { background: #334155; border-radius: 5px; }

  .lyrics-display {
    font-size: 24px; color: #F8FAFC; font-weight: 600; line-height: 2.4; white-space: pre-wrap;
    text-shadow: 0px 2px 15px rgba(56, 189, 248, 0.5); padding-bottom: 50px;
  }

  .lyric-line {
    padding: 10px 8px; font-size: 20px; color: #94A3B8; transition: all 0.3s ease; line-height: 1.8;
  }
  .active-lyric {
    color: var(--primary); font-size: 28px; font-weight: 800; transform: scale(1.05);
    text-shadow: 0px 2px 15px rgba(56, 189, 248, 0.8);
  }
  
  #playerView:fullscreen { background: #000; padding: 20px; display: flex; flex-direction: column; justify-content: center; }
  #playerView:fullscreen .card { box-shadow: none; border-radius: 0; background: transparent; height: 100%; display: flex; flex-direction: column;}
  #playerView:fullscreen .karaoke-container { height: 100%; border: none; flex-grow: 1;}
  #playerView:fullscreen .lyrics-display { font-size: 30px; line-height: 2.6; }
  #playerView:fullscreen #playerHeader button { background: #334155; color: white; border: none; }
  
  .view { display: none; }
  .view.active { display: block; }
  
  #draftFileInfo {
    display: none; font-size: 13px; color: #10B981; margin-top: 8px; 
    padding: 10px; background: #064E3B; border-radius: 8px; border: 1px solid #047857;
  }

  /* Sync Maker UI Styles */
  .sync-maker-box { background: #0F172A; padding: 20px; border-radius: 12px; margin-top: 16px; text-align: center; border: 1px solid #334155; }
  .sync-prev { color: #94A3B8; font-size: 14px; margin-bottom: 8px; min-height: 20px; }
  .sync-current { color: var(--primary); font-size: 24px; font-weight: bold; min-height: 35px; margin-bottom: 8px; transition: 0.2s; }
  .sync-next { color: #64748B; font-size: 16px; min-height: 24px; }
</style>
</head>
<body>

<div class="container">
  
  <!-- Library View -->
  <div id="libraryView" class="view active">
    <div class="card">
      <h1>🎵 പാട്ടുകളുടെ ശേഖരം</h1>
      <ul class="song-list" id="savedSongsList"></ul>
      <button id="showAddViewBtn" style="margin-top: 20px;">+ പുതിയ പാട്ട് ചേർക്കുക</button>
    </div>
  </div>

  <!-- Add View -->
  <div id="addView" class="view">
    <div class="card">
      <h1>പുതിയ പാട്ട് ചേർക്കുക</h1>
      
      <label style="font-size: 13px; color: var(--text-muted); display: block; margin-top: 16px;">MP3 / MP4 ഫയൽ തിരഞ്ഞെടുക്കുക</label>
      <input type="file" id="mediaFile" accept="audio/*, video/mp4">
      <div id="draftFileInfo"></div>
      
      <label style="font-size: 13px; color: var(--text-muted); margin-top: 16px; display: block;">പാട്ടിന്റെ പേര്</label>
      <input type="text" id="songTitleInput" placeholder="ഉദാ: മാണിക്യ മലരായ...">
      
      <button type="button" onclick="searchLyrics()" class="btn-outline" style="margin-top: 8px; padding: 10px; font-size: 14px;">🔍 വരികൾ തിരയുക (Google)</button>
      
      <label style="font-size: 13px; color: var(--text-muted); display: block; margin-top: 16px;">വരികൾ പേസ്റ്റ് ചെയ്യുക</label>
      <textarea id="customLyrics" placeholder="സാധാരണ വരികളോ അല്ലെങ്കിൽ സിങ്ക് ചെയ്ത വരികളോ പേസ്റ്റ് ചെയ്യാം..."></textarea>
      
      <!-- New Button for LRC Maker -->
      <button type="button" id="openSyncMakerBtn" class="btn-outline" style="margin-top: 8px; padding: 10px; font-size: 14px; border-color: #10B981; color: #10B981;">⏱️ വരികൾ പാട്ടിനൊപ്പം സ്വയം സിങ്ക് ചെയ്യുക (LRC Maker)</button>
      
      <button id="processBtn">പാട്ടും വരികളും സേവ് ചെയ്യുക</button>
      <button class="btn-outline" id="backToLibraryBtn">ക്യാൻസൽ</button>
      
      <div class="progress-container" id="progressBox">
        <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressBar"></div></div>
        <div class="progress-text" id="progressText">0%</div>
        <div style="font-size: 12px; color: var(--text-muted); margin-top: 4px;" id="progressStatus">പ്രോസസ്സ് ചെയ്യുന്നു...</div>
      </div>
    </div>
  </div>

  <!-- Sync Maker View -->
  <div id="syncView" class="view">
    <div class="card">
      <h1>⏱️ LRC Maker</h1>
      <p style="font-size: 13px; color: var(--text-muted); text-align:center;">പാട്ട് പ്ലേ ചെയ്ത്, ഓരോ വരിയും പാടുന്ന കൃത്യസമയത്ത് പച്ച ബട്ടൺ അമർത്തുക.</p>
      
      <audio id="syncAudio" controls style="width: 100%; margin-top: 10px;"></audio>
      
      <div class="sync-maker-box">
          <div id="syncPrev" class="sync-prev"></div>
          <div id="syncCurrent" class="sync-current">വരികൾ ലോഡ് ചെയ്യുന്നു...</div>
          <div id="syncNext" class="sync-next"></div>
      </div>
      
      <button id="stampBtn" style="background: #10B981; color: white; padding: 20px; font-size: 18px; margin-top: 20px;">📌 ഈ വരിയുടെ സമയം സേവ് ചെയ്യുക</button>
      
      <div style="display: flex; gap: 10px; margin-top: 10px;">
           <button id="syncCancelBtn" class="btn-outline" style="flex:1;">ക്യാൻസൽ</button>
           <button id="syncSaveBtn" style="background: #3B82F6; color: white; flex:1;">സേവ് ചെയ്യുക</button>
      </div>
    </div>
  </div>

  <!-- Player View -->
  <div id="playerView" class="view">
    <div class="card">
      <div id="playerHeader">
        <button class="btn-outline" id="playerBackBtn">🔙 പുറകോട്ട്</button>
        <button class="btn-outline" id="fullscreenBtn" onclick="toggleFullScreen()">🔲 Full Screen</button>
      </div>
      <h1 id="playerTitle">പാട്ട്</h1>
      <audio id="audioPlayer" controls></audio>
      <div class="karaoke-container" id="lyricsBox"></div>
    </div>
  </div>

</div>

<script>
  const DB_NAME = 'ProKaraokeDB';
  let db = null;
  let pendingFile = null;
  let currentLyricsData = []; 

  // LRC Maker Variables
  let syncLines = [];
  let syncedLRC = [];
  let syncIndex = 0;

  function initDB() {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open(DB_NAME, 1);
      request.onupgradeneeded = (e) => {
        let database = e.target.result;
        if (!database.objectStoreNames.contains('songs')) {
          database.createObjectStore('songs', { keyPath: 'id' });
        }
      };
      request.onsuccess = (e) => { db = e.target.result; resolve(db); };
      request.onerror = (e) => reject(e);
    });
  }

  function saveSongToDB(song) {
    return new Promise((resolve, reject) => {
      if(!db) return reject(new Error("Database not initialized"));
      const tx = db.transaction('songs', 'readwrite');
      tx.objectStore('songs').put(song);
      tx.oncomplete = () => resolve();
      tx.onerror = (e) => reject(e);
    });
  }

  function getAllSongsFromDB() {
    return new Promise((resolve, reject) => {
      if(!db) return resolve([]);
      const tx = db.transaction('songs', 'readonly');
      const request = tx.objectStore('songs').getAll();
      request.onsuccess = () => resolve(request.result);
      request.onerror = (e) => reject(e);
    });
  }

  function getSongFromDB(id) {
    return new Promise((resolve, reject) => {
      if(!db) return resolve(null);
      const tx = db.transaction('songs', 'readonly');
      const request = tx.objectStore('songs').get(id);
      request.onsuccess = () => resolve(request.result);
      request.onerror = (e) => reject(e);
    });
  }

  function deleteSongFromDB(id) {
    return new Promise((resolve, reject) => {
      if(!db) return resolve();
      try {
        const tx = db.transaction('songs', 'readwrite');
        const store = tx.objectStore('songs');
        store.delete(id);
        tx.oncomplete = () => resolve();
        tx.onerror = (e) => reject(e);
      } catch (error) {
        reject(error);
      }
    });
  }

  function showView(viewId) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById(viewId).classList.add('active');
  }

  function toggleFullScreen() {
    const playerView = document.getElementById('playerView');
    if (!document.fullscreenElement) {
        if (playerView.requestFullscreen) { playerView.requestFullscreen(); } 
        else if (playerView.webkitRequestFullscreen) { playerView.webkitRequestFullscreen(); } 
    } else {
        if (document.exitFullscreen) { document.exitFullscreen(); } 
        else if (document.webkitExitFullscreen) { document.webkitExitFullscreen(); } 
    }
  }

  async function saveDraft() {
    if(!db) return;
    const title = document.getElementById('songTitleInput').value.trim();
    const lyrics = document.getElementById('customLyrics').value.trim();
    if(!pendingFile && !title && !lyrics) return;
    
    const draftData = { id: 'DRAFT', title: title, audioBlob: pendingFile, fileName: pendingFile ? (pendingFile.name || 'Audio') : '', customLyrics: lyrics };
    await saveSongToDB(draftData);
  }

  document.getElementById('mediaFile').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if(file) {
        pendingFile = file;
        document.getElementById('draftFileInfo').innerText = "✔️ തിരഞ്ഞെടുത്ത ഫയൽ: " + file.name;
        document.getElementById('draftFileInfo').style.display = 'block';
        const titleInput = document.getElementById('songTitleInput');
        if(!titleInput.value) { titleInput.value = file.name.replace(/\.[^/.]+$/, ""); }
        if(db) await saveDraft();
    }
  });

  document.getElementById('songTitleInput').addEventListener('input', saveDraft);
  document.getElementById('customLyrics').addEventListener('input', saveDraft);

  function searchLyrics() {
    let title = document.getElementById('songTitleInput').value.trim();
    if(!title) { title = "malayalam movie song"; }
    const query = encodeURIComponent(title + " lyrics malayalam");
    window.open("https://www.google.com/search?q=" + query, "_blank");
  }

  document.addEventListener('DOMContentLoaded', async () => {
    try {
        await initDB();
        const draft = await getSongFromDB('DRAFT');
        if (draft && (draft.title || draft.audioBlob || draft.customLyrics)) {
            if (draft.title) document.getElementById('songTitleInput').value = draft.title;
            if (draft.customLyrics) document.getElementById('customLyrics').value = draft.customLyrics;
            if (draft.audioBlob) {
                pendingFile = draft.audioBlob;
                document.getElementById('draftFileInfo').innerText = "✔️ നേരത്തെ തിരഞ്ഞെടുത്ത ഫയൽ: " + draft.fileName;
                document.getElementById('draftFileInfo').style.display = 'block';
            }
            showView('addView');
        } else { loadLibrary(); }
    } catch(e) { console.error(e); loadLibrary(); }
  });

  document.getElementById('showAddViewBtn').addEventListener('click', () => { showView('addView'); });
  
  document.getElementById('backToLibraryBtn').addEventListener('click', async () => {
      await deleteSongFromDB('DRAFT');
      pendingFile = null;
      document.getElementById('songTitleInput').value = '';
      document.getElementById('mediaFile').value = '';
      document.getElementById('customLyrics').value = '';
      document.getElementById('draftFileInfo').style.display = 'none';
      loadLibrary();
      showView('libraryView');
  });
  
  document.getElementById('playerBackBtn').addEventListener('click', () => {
    if (document.fullscreenElement) { document.exitFullscreen(); }
    document.getElementById('audioPlayer').pause();
    showView('libraryView');
  });

  async function loadLibrary() {
    const songs = await getAllSongsFromDB();
    const list = document.getElementById('savedSongsList');
    list.innerHTML = '';
    const actualSongs = songs.filter(s => s.id !== 'DRAFT');

    if(actualSongs.length === 0) {
      list.innerHTML = '<p style="text-align:center; color:#94A3B8; font-size:14px;">ഇതുവരെ പാട്ടുകൾ സേവ് ചെയ്തിട്ടില്ല.</p>';
      return;
    }

    actualSongs.reverse().forEach(song => {
      const li = document.createElement('li');
      li.className = 'song-item';
      li.innerHTML = `
        <span class="song-title">${song.title}</span>
        <div class="song-actions">
          <button onclick="playSavedSong(${song.id})" style="background:#10B981; color:#fff;">Play</button>
          <button onclick="exportSong(${song.id})" style="background:#3B82F6; color:#fff;">Share</button>
          <button onclick="deleteSong('${song.id}')" style="background:#EF4444; color:#fff;">Del</button>
        </div>
      `;
      list.appendChild(li);
    });
  }

  window.deleteSong = async (id) => {
    if(confirm('ഈ പാട്ട് ഡിലീറ്റ് ചെയ്യണോ?')) {
      try { await deleteSongFromDB(Number(id)); } catch (e) { console.error("Delete failed", e); }
      loadLibrary();
    }
  }

  // --- LRC / FRC Maker Logic ---
  document.getElementById('openSyncMakerBtn').addEventListener('click', () => {
      const rawLyrics = document.getElementById('customLyrics').value.trim();
      const file = pendingFile || (document.getElementById('mediaFile').files.length > 0 ? document.getElementById('mediaFile').files[0] : null);
      
      if (!file) return alert('ആദ്യം ഒരു ഓഡിയോ/വീഡിയോ ഫയൽ തിരഞ്ഞെടുക്കുക!');
      if (!rawLyrics) return alert('ആദ്യം സാധാരണ വരികൾ നൽകുക/പേസ്റ്റ് ചെയ്യുക!');

      syncLines = rawLyrics.split('\n').map(l => l.trim()).filter(l => l.length > 0);
      if(syncLines.some(l => l.match(/^\[\d{2}:\d{2}/))) {
          if(!confirm('ഈ വരികളിൽ ഇതിനകം തന്നെ ടൈമിംഗ് സെറ്റ് ചെയ്തിട്ടുണ്ട്. വീണ്ടും സെറ്റ് ചെയ്യണോ?')) return;
          syncLines = syncLines.map(l => l.replace(/^\[\d{2}:\d{2}(?:\.\d{1,3})?\]\s*/, ''));
      }

      syncedLRC = [];
      syncIndex = 0;

      const audioUrl = URL.createObjectURL(file);
      const syncAudio = document.getElementById('syncAudio');
      syncAudio.src = audioUrl;
      
      updateSyncDisplay();
      showView('syncView');
  });

  function updateSyncDisplay() {
      document.getElementById('syncPrev').innerText = syncIndex > 0 ? syncLines[syncIndex - 1] : '';
      
      if(syncIndex < syncLines.length) {
          document.getElementById('syncCurrent').innerText = syncLines[syncIndex];
          document.getElementById('syncCurrent').style.color = "var(--primary)";
          document.getElementById('stampBtn').disabled = false;
          document.getElementById('stampBtn').innerText = "📌 ഈ വരിയുടെ സമയം സേവ് ചെയ്യുക";
          document.getElementById('syncNext').innerText = syncIndex + 1 < syncLines.length ? syncLines[syncIndex + 1] : '';
      } else {
          document.getElementById('syncCurrent').innerText = "പൂർത്തിയായി! 🎉";
          document.getElementById('syncCurrent').style.color = "#10B981";
          document.getElementById('stampBtn').disabled = true;
          document.getElementById('stampBtn').innerText = "എല്ലാം സിങ്ക് ചെയ്തു";
          document.getElementById('syncNext').innerText = '';
      }
  }

  document.getElementById('stampBtn').addEventListener('click', () => {
      if(syncIndex >= syncLines.length) return;
      
      const time = document.getElementById('syncAudio').currentTime;
      let min = Math.floor(time / 60);
      let sec = (time % 60).toFixed(2);
      let timeStr = `[${min.toString().padStart(2, '0')}:${sec.padStart(5, '0')}]`;
      
      syncedLRC.push(`${timeStr} ${syncLines[syncIndex]}`);
      syncIndex++;
      updateSyncDisplay();
  });

  document.getElementById('syncCancelBtn').addEventListener('click', () => {
      document.getElementById('syncAudio').pause();
      showView('addView');
  });

  document.getElementById('syncSaveBtn').addEventListener('click', () => {
      if(syncedLRC.length > 0) {
          document.getElementById('customLyrics').value = syncedLRC.join('\n');
          saveDraft();
          alert('സമയക്രമം ചേർത്ത വരികൾ വിജയകരമായി സേവ് ചെയ്തു!');
      }
      document.getElementById('syncAudio').pause();
      showView('addView');
  });


  // --- Export Logic ---
  window.exportSong = async (id) => {
    const song = await getSongFromDB(Number(id));
    if(!song) return alert('പാട്ട് കണ്ടെത്താനായില്ല.');

    alert('ഏത് ഫോണിലും നേരിട്ട് പ്രവർത്തിക്കുന്ന ഫയൽ തയ്യാറാക്കുന്നു... അല്പം കാത്തിരിക്കുക.');

    const reader = new FileReader();
    reader.readAsDataURL(song.audioBlob);
    reader.onloadend = () => {
      const base64Audio = reader.result;
      const escapedLyrics = (song.lyrics || 'വരികൾ ലഭ്യമല്ല.').replace(/`/g, '\\`').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      
      const songDataStr = JSON.stringify({
        title: song.title,
        lyrics: escapedLyrics,
        audio: base64Audio
      });
      
      const htmlContent = `<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>${song.title} - Play</title>
  <link href="https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@400;600;800&display=swap" rel="stylesheet">
  <style>

  // --- Process & Save Logic ---
  function updateProgress(percent, text) {
    document.getElementById('progressBox').style.display = 'block';
    document.getElementById('progressBar').style.width = percent + '%';
    document.getElementById('progressText').innerText = percent + '%';
    document.getElementById('progressStatus').innerText = text;
  }

  document.getElementById('processBtn').addEventListener('click', async () => {
    const file = pendingFile || (document.getElementById('mediaFile').files.length > 0 ? document.getElementById('mediaFile').files[0] : null);
    const title = document.getElementById('songTitleInput').value.trim() || (file ? (file.name ? file.name.replace(/\.[^/.]+$/, "") : 'My Song') : 'My Song');
    let customLyricsText = document.getElementById('customLyrics').value.trim();

    if(!customLyricsText) { alert('ദയവായി വരികൾ നൽകുക/പേസ്റ്റ് ചെയ്യുക!'); return; }
    if(!file) return alert('ഒരു ഓഡിയോ/വീഡിയോ ഫയൽ തിരഞ്ഞെടുക്കുക!');

    document.getElementById('processBtn').disabled = true;
    updateProgress(50, 'പ്രോസസ്സ് ചെയ്യുന്നു...');
    
    try {
      const songData = { id: Date.now(), title: title, audioBlob: file, lyrics: customLyricsText };
      await saveSongToDB(songData);
      await deleteSongFromDB('DRAFT');
      pendingFile = null;
      updateProgress(100, 'പൂർത്തിയായി!');
      
      setTimeout(() => {
          alert('പാട്ട് വിജയകരമായി ചേർത്തു!');
          document.getElementById('songTitleInput').value = '';
          document.getElementById('mediaFile').value = '';
          document.getElementById('customLyrics').value = '';
          document.getElementById('draftFileInfo').style.display = 'none';
          document.getElementById('progressBox').style.display = 'none';
          loadLibrary();
          showView('libraryView');
      }, 300);

    } catch (error) {
      alert("പിഴവ്: " + error.message);
      document.getElementById('progressBox').style.display = 'none';
    } finally {
      document.getElementById('processBtn').disabled = false;
    }
  });

  function parseLRC(text) {
      const lines = text.split('\n');
      const parsedData = [];
      const timeRegEx = /\[(\d{2}):(\d{2}(?:\.\d{1,3})?)\](.*)/; 
      let isLRC = false;

      lines.forEach(line => {
          const match = line.match(timeRegEx);
          if (match) {
              isLRC = true;
              const timeInSeconds = (parseInt(match[1], 10) * 60) + parseFloat(match[2]);
              parsedData.push({ time: timeInSeconds, text: match[3].trim() });
          }
      });
      return { isLRC, parsedData };
  }

  window.playSavedSong = async (id) => {
    const song = await getSongFromDB(Number(id));
    if(!song) return alert('പാട്ട് കണ്ടെത്താനായില്ല.');

    document.getElementById('playerTitle').innerText = song.title;
    const audioUrl = URL.createObjectURL(song.audioBlob);
    const audio = document.getElementById('audioPlayer');
    audio.src = audioUrl;

    const box = document.getElementById('lyricsBox');
    box.innerHTML = '';
    
    const { isLRC, parsedData } = parseLRC(song.lyrics || '');

    if (isLRC && parsedData.length > 0) {
        currentLyricsData = parsedData;
        parsedData.forEach((line, index) => {
            const div = document.createElement('div');
            div.className = 'lyric-line';
            div.id = 'line-' + index;
            div.innerText = line.text === '' ? '\u00A0' : line.text; 
            box.appendChild(div);
        });
        const paddingDiv = document.createElement('div');
        paddingDiv.style.height = "50%";
        box.appendChild(paddingDiv);
    } else {
        currentLyricsData = [];
        box.innerHTML = `<div class="lyrics-display">${song.lyrics || 'വരികൾ ലഭ്യമല്ല.'}</div>`;
    }
    showView('playerView');
  };

  document.getElementById('audioPlayer').addEventListener('timeupdate', () => {
      if (currentLyricsData.length === 0) return;
      const time = document.getElementById('audioPlayer').currentTime;
      let currentIndex = -1;

      for (let i = 0; i < currentLyricsData.length; i++) {
          if (time >= currentLyricsData[i].time) { currentIndex = i; } else { break; }
      }

      if (currentIndex !== -1) {
          document.querySelectorAll('.lyric-line').forEach(el => el.classList.remove('active-lyric'));
          const activeLine = document.getElementById('line-' + currentIndex);
          if (activeLine && !activeLine.classList.contains('active-lyric')) {
              activeLine.classList.add('active-lyric');
              const box = document.getElementById('lyricsBox');
              const scrollAmount = activeLine.offsetTop - box.offsetTop - (box.clientHeight / 2) + (activeLine.clientHeight / 2);
              box.scrollTop = scrollAmount;
          }
      }
  });

</script>
