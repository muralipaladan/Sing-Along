<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Birthday Fullscreen Lyrics Video Maker</title>
<link href="https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@400;600&family=Manjari:wght@400;700&family=Poppins:wght@600;800&family=Dancing+Script:wght@700&family=Noto+Sans+Devanagari:wght@600;800&family=Noto+Sans+Arabic:wght@600;800&family=Noto+Sans+Malayalam:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0F172A; --panel: #1E293B; --accent: #38BDF8; --text: #F8FAFC; --muted: #94A3B8;
  }
  * { box-sizing: border-box; }
  body, html { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: 'Anek Malayalam', sans-serif; min-height: 100%; }

  .top-section { max-width: 500px; margin: 0 auto; padding: 10px 12px 0; display: flex; flex-direction: column; gap: 8px; }
  h1 { font-size: 18px; text-align: center; margin: 4px 0; color: var(--accent); }

  .input-group { display: flex; flex-direction: column; gap: 4px; }
  label { font-size: 12px; color: var(--muted); }

  input[type="file"], input[type="text"], select, textarea, input[type="number"] {
    width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1);
    background: var(--panel); color: var(--text); font-family: inherit; font-size: 13px;
  }
  textarea { height: 60px; resize: none; }

  .ctrl-bar {
    position: sticky; top: 0; z-index: 100;
    background: #111827;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    padding: 6px 10px;
    display: flex; flex-direction: column; gap: 5px;
    max-width: 500px; margin: 0 auto;
  }

  .speed-row { display: flex; align-items: center; gap: 6px; }
  .speed-label { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .speed-val { color: var(--accent); font-weight: bold; font-size: 13px; background: #000; padding: 1px 6px; border-radius: 4px; min-width: 32px; text-align: center; }
  .ico-btn {
    background: var(--panel); border: 1px solid rgba(255,255,255,0.2); color: white;
    width: 32px; height: 30px; border-radius: 5px; font-size: 16px; cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .ico-btn:active { background: rgba(255,255,255,0.15); }
  input[type="range"] { flex: 1; cursor: pointer; accent-color: var(--accent); height: 18px; }

  .action-row { display: flex; align-items: center; gap: 6px; }
  .btn-pause {
    flex: 1; background: #374151; color: white; font-weight: 600; border: none; padding: 6px 8px;
    border-radius: 7px; font-size: 12px; cursor: pointer; transition: 0.2s; white-space: nowrap;
  }
  .btn-pause.paused { background: #F59E0B; color: #000; }

  .btn-rec {
    background: var(--accent); color: #000; font-weight: 700; border: none; padding: 6px 12px;
    border-radius: 7px; font-size: 13px; cursor: pointer; white-space: nowrap; flex-shrink: 0;
  }
  .btn-rec:active { transform: scale(0.97); }
  .btn-stop {
    background: #EF4444; color: #fff; font-weight: 700; border: none; padding: 6px 12px;
    border-radius: 7px; font-size: 13px; cursor: pointer; white-space: nowrap; flex-shrink: 0; display: none;
  }

  .audio-row audio { width: 100%; height: 32px; }

  .status-row { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 16px; }
  .recording-indicator { color: #EF4444; font-weight: bold; font-size: 12px; display: none; animation: blink 1s infinite; }
  .status { font-size: 12px; color: #10B981; display: none; }
  @keyframes blink { 50% { opacity: 0.4; } }

  .canvas-wrapper {
    width: 100%; max-width: 500px; margin: 0 auto;
    aspect-ratio: 9/16; background: #000; overflow: hidden;
  }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; outline: none; }
  canvas:active { cursor: grabbing; }

  .custom-anim-panel {
    max-width: 500px; margin: 15px auto 40px; padding: 14px;
    background: #1E293B; border-radius: 12px; border: 1px solid rgba(56, 189, 248, 0.25);
    box-shadow: 0 10px 25px rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 10px;
  }
  .panel-title {
    font-size: 14px; font-weight: 700; color: var(--accent); margin: 0;
    display: flex; align-items: center; gap: 6px;
  }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
</style>
</head>
<body>

<div class="top-section">
  <h1>🎂 Birthday Lyrics Video Maker</h1>

  <div class="input-group">
    <label>📸 Birthday Person Photo (Full Screen & Bubbles)</label>
    <input type="file" id="mainPhotoInput" accept="image/*">
  </div>

  <div class="input-group">
    <label>🎵 പാട്ട് (Audio / Video)</label>
    <input type="file" id="audioInput" accept="audio/*,video/*,.mp3,.mp4,.webm,.m4a,.opus">
  </div>

  <div class="custom-anim-panel" style="margin:8px auto 0;">
    <h2 class="panel-title">✨ ആനിമേഷൻ & ബാക്ക്‌ഗ്രൗണ്ട് കൺട്രോളുകൾ</h2>

    <div class="grid-2">
      <div class="input-group">
        <label>1. Photo Darkness (Overlay)</label>
        <div style="display:flex; align-items:center; gap:6px;">
          <input type="range" id="bgDimSlider" min="10" max="90" value="45">
          <span id="bgDimDisplay" class="speed-val">45%</span>
        </div>
      </div>
      <div class="input-group">
        <label>2. Lyrics Font Size (px)</label>
        <div style="display:flex; align-items:center; gap:6px;">
          <input type="range" id="fontSizeSlider" min="16" max="60" value="28">
          <span id="fontSizeDisplay" class="speed-val">28px</span>
        </div>
      </div>
    </div>

    <div class="grid-2">
      <div class="input-group">
        <label>3. Animation Speed (Number)</label>
        <input type="number" id="animSpeedFactor" min="0.2" max="3.0" step="0.1" value="1.0">
      </div>
      <div class="input-group">
        <label>4. Floating Photo Bubbles</label>
        <select id="bubbleToggleSelect">
          <option value="yes">On (പാറിപ്പറക്കുന്ന ഫോട്ടോകൾ)</option>
          <option value="no">Off (ഫുൾസ്ക്രീൻ മാത്രം)</option>
        </select>
      </div>
    </div>

    <div class="input-group">
      <label>5. Birthday Wish / Banner</label>
      <input type="text" id="birthdayWishInput" value="Happy Birthday to You 💖" placeholder="ആശംസകൾ ഇവിടെ എഴുതാം...">
    </div>

    <div class="grid-2">
      <div class="input-group">
        <label>6. Emojis (Floating)</label>
        <input type="text" id="customEmojisInput" value="💖 🎂 ✨ 🎈 🌸 🦋">
      </div>
      <div class="input-group">
        <label>7. Glowing Name / Letters</label>
        <input type="text" id="customNameInput" placeholder="Aiswarya / പേരുകൾ...">
      </div>
    </div>

    <div class="input-group" id="multiLangBlock">
      <label>7a. Multi-Language Glow (English, Hindi, Malayalam, Arabic)</label>
      <div style="display:flex; gap:6px;">
        <input type="text" id="geminiApiKeyInput" placeholder="🔑 Gemini API Key (transliteration-നു മാത്രം)" style="flex:1;">
        <button type="button" id="translitBtn" class="ico-btn" style="width:auto; padding:0 10px; font-size:12px;">Translate ✨</button>
      </div>
      <div id="translitPreview" style="font-size:11px; color:var(--muted); margin-top:4px; min-height:14px;"></div>
    </div>

    <div class="input-group">
      <label>8. Falling Flower Theme</label>
      <select id="flowerThemeSelect">
        <option value="rose">Red & Pink Roses (റൊമാന്റിക്/ബർത്ത്‌ഡേ)</option>
        <option value="golden">Golden Sparkle (ഗോൾഡൻ തിളക്കം)</option>
        <option value="multi">Mix Colors (കളർഫുൾ)</option>
        <option value="sakura">Sakura Pink</option>
      </select>
    </div>
  </div>

  <div class="input-group">
    <label>📝 വരികൾ (Lyrics)</label>
    <textarea id="lyricsInput" placeholder="വരികൾ ഇവിടെ പേസ്റ്റ് ചെയ്യുക..."></textarea>
  </div>
</div>

<div class="ctrl-bar">
  <div class="speed-row">
    <span class="speed-label">ലിറിക്സ് സ്പീഡ്</span>
    <button class="ico-btn" id="btnSlow">−</button>
    <input type="range" id="speedSlider" min="0" max="150" value="40">
    <button class="ico-btn" id="btnFast">+</button>
    <span class="speed-val" id="speedValue">40</span>
  </div>

  <div class="audio-row">
    <audio id="audioPlayer" crossOrigin="anonymous" controls></audio>
  </div>

  <div class="action-row">
    <button id="pauseScrollBtn" class="btn-pause">⏸ സ്ക്രോൾ നിർത്തുക</button>
    <button id="recordBtn" class="btn-rec">🔴 Record</button>
    <button id="stopBtn" class="btn-stop">⏹ Stop</button>
  </div>

  <div class="status-row">
    <span id="recordingStatus" class="recording-indicator">● റെക്കോർഡ് ചെയ്യുന്നു...</span>
    <span id="saveStatus" class="status">✅ വീഡിയോ സേവ് ആയി!</span>
  </div>
</div>

<div class="canvas-wrapper">
  <canvas id="videoCanvas" width="720" height="1280" tabindex="0"></canvas>
</div>

<script>
  const mainPhotoInput = document.getElementById('mainPhotoInput');
  const audioInput = document.getElementById('audioInput');
  const lyricsInput = document.getElementById('lyricsInput');
  const speedSlider = document.getElementById('speedSlider');
  const speedValue = document.getElementById('speedValue');
  const btnSlow = document.getElementById('btnSlow');
  const btnFast = document.getElementById('btnFast');
  const pauseScrollBtn = document.getElementById('pauseScrollBtn');
  const canvas = document.getElementById('videoCanvas');
  const ctx = canvas.getContext('2d');
  const recordBtn = document.getElementById('recordBtn');
  const stopBtn = document.getElementById('stopBtn');
  const audioPlayer = document.getElementById('audioPlayer');
  const recordingStatus = document.getElementById('recordingStatus');
  const saveStatus = document.getElementById('saveStatus');

  const customEmojisInput = document.getElementById('customEmojisInput');
  const customNameInput = document.getElementById('customNameInput');
  const flowerThemeSelect = document.getElementById('flowerThemeSelect');
  const geminiApiKeyInput = document.getElementById('geminiApiKeyInput');
  const translitBtn = document.getElementById('translitBtn');
  const translitPreview = document.getElementById('translitPreview');
  const fontSizeSlider = document.getElementById('fontSizeSlider');
  const fontSizeDisplay = document.getElementById('fontSizeDisplay');
  const bgDimSlider = document.getElementById('bgDimSlider');
  const bgDimDisplay = document.getElementById('bgDimDisplay');
  const animSpeedFactor = document.getElementById('animSpeedFactor');
  const birthdayWishInput = document.getElementById('birthdayWishInput');
  const bubbleToggleSelect = document.getElementById('bubbleToggleSelect');

  let mediaRecorder;
  let recordedChunks = [];
  let audioCtx, source, dest;
  let lines = [];
  
  let scrollSpeed = parseInt(speedSlider.value);
  let manualOffset = 0; 
  let autoScrollY = 0; 
  let lastTime = performance.now();
  
  let isDragging = false;
  let startY = 0;
  let dragStartYOffset = 0;
  let isScrollPaused = false;

  let bgImage = null;
  mainPhotoInput.addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file) {
      const img = new Image();
      img.src = URL.createObjectURL(file);
      img.onload = () => { 
        bgImage = img;
        initFloatingPhotos();
      };
    }
  });

  let currentFontSize = parseInt(fontSizeSlider.value);
  let FONT = `bold ${currentFontSize}px 'Manjari', sans-serif`;
  let LINE_SPACING = Math.round(currentFontSize * 1.85);

  fontSizeSlider.addEventListener('input', (e) => {
    currentFontSize = parseInt(e.target.value);
    fontSizeDisplay.textContent = `${currentFontSize}px`;
    FONT = `bold ${currentFontSize}px 'Manjari', sans-serif`;
    LINE_SPACING = Math.round(currentFontSize * 1.85);
    updateLines();
  });

  bgDimSlider.addEventListener('input', (e) => {
    bgDimDisplay.textContent = `${e.target.value}%`;
  });

  function updateSpeed(val) {
    scrollSpeed = Math.max(0, Math.min(150, val));
    speedSlider.value = scrollSpeed;
    speedValue.textContent = scrollSpeed;
  }
  
  speedSlider.addEventListener('input', (e) => updateSpeed(parseInt(e.target.value)));
  btnSlow.addEventListener('click', () => updateSpeed(scrollSpeed - 2));
  btnFast.addEventListener('click', () => updateSpeed(scrollSpeed + 2));

  pauseScrollBtn.addEventListener('click', () => {
    isScrollPaused = !isScrollPaused;
    if (isScrollPaused) {
      pauseScrollBtn.textContent = '▶ സ്ക്രോളിംഗ് തുടരുക';
      pauseScrollBtn.classList.add('paused');
    } else {
      pauseScrollBtn.textContent = '⏸ സ്ക്രോൾ നിർത്തുക';
      pauseScrollBtn.classList.remove('paused');
    }
  });

  audioInput.addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file) {
      audioPlayer.src = URL.createObjectURL(file);
    }
  });

  lyricsInput.addEventListener('input', function() {
    updateLines();
  });

  function updateLines() {
    ctx.font = FONT;
    const rawLines = lyricsInput.value.split('\n');
    lines = [];
    const maxWidth = canvas.width - 60;
    rawLines.forEach(text => {
      if (text.trim() === '') { lines.push(''); return; }
      const words = text.split(' ');
      let cur = words[0] || '';
      for (let i = 1; i < words.length; i++) {
        const test = cur + ' ' + words[i];
        if (ctx.measureText(test).width < maxWidth) { cur = test; }
        else { lines.push(cur); cur = words[i]; }
      }
      if (cur) lines.push(cur);
    });
  }

  function getEventY(e) { return e.touches ? e.touches[0].clientY : e.clientY; }

  function onDragStart(e) {
    isDragging = true;
    startY = getEventY(e);
    dragStartYOffset = manualOffset;
    canvas.focus(); 
  }

  function onDragMove(e) {
    if (!isDragging) return;
    let dy = getEventY(e) - startY;
    let scale = canvas.height / canvas.clientHeight; 
    manualOffset = dragStartYOffset + (dy * scale);
  }

  function onDragEnd() { isDragging = false; }

  canvas.addEventListener('mousedown', onDragStart);
  window.addEventListener('mousemove', onDragMove);
  window.addEventListener('mouseup', onDragEnd);
  
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    let scale = canvas.height / canvas.clientHeight;
    manualOffset -= (e.deltaY * scale * 1.5);
  }, { passive: false });

  canvas.addEventListener('touchstart', onDragStart, { passive: true });
  window.addEventListener('touchmove', onDragMove, { passive: true });
  window.addEventListener('touchend', onDragEnd);
  window.addEventListener('touchcancel', onDragEnd);

  recordBtn.addEventListener('click', async () => {
    if (!audioPlayer.src) {
      alert("ആദ്യം ഒരു പാട്ട് അപ്‌ലോഡ് ചെയ്യുക!");
      return;
    }
    
    updateLines(); 
    manualOffset = 0; 
    autoScrollY = 0;
    lastTime = performance.now();
    isScrollPaused = false;
    pauseScrollBtn.textContent = '⏸ സ്ക്രോൾ നിർത്തുക';
    pauseScrollBtn.classList.remove('paused');
    canvas.focus(); 
    
    try {
        await audioPlayer.play();
    } catch (err) {
        console.error("Audio play failed:", err);
    }
    
    let audioTracks = [];
    if (audioPlayer.captureStream || audioPlayer.mozCaptureStream) {
        const aStream = audioPlayer.captureStream ? audioPlayer.captureStream() : audioPlayer.mozCaptureStream();
        audioTracks = aStream.getAudioTracks();
    }
    
    if (audioTracks.length === 0) {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          source = audioCtx.createMediaElementSource(audioPlayer);
          dest = audioCtx.createMediaStreamDestination();
          source.connect(dest);
          source.connect(audioCtx.destination);
        }
        await audioCtx.resume();
        audioTracks = dest.stream.getAudioTracks();
    }
    
    audioPlayer.currentTime = 0; 
    
    const canvasStream = canvas.captureStream(30); 
    const combinedStream = new MediaStream([
      ...canvasStream.getVideoTracks(),
      ...audioTracks
    ]);
    
    let mimeType = 'video/webm;codecs=vp8,opus';
    if (!MediaRecorder.isTypeSupported(mimeType)) {
        mimeType = MediaRecorder.isTypeSupported('video/mp4') ? 'video/mp4' : 'video/webm';
    }
    
    mediaRecorder = new MediaRecorder(combinedStream, { mimeType: mimeType });
    recordedChunks = [];
    
    mediaRecorder.ondataavailable = e => {
      if (e.data.size > 0) recordedChunks.push(e.data);
    };
    
    mediaRecorder.onstop = () => {
      const blob = new Blob(recordedChunks, { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Birthday-Lyrics-${Date.now()}.${mimeType.includes('mp4') ? 'mp4' : 'webm'}`;
      a.click();
      
      recordBtn.style.display = 'inline-block';
      stopBtn.style.display = 'none';
      recordingStatus.style.display = 'none';
      saveStatus.style.display = 'block';
      setTimeout(() => saveStatus.style.display = 'none', 4000);
    };
    
    recordBtn.style.display = 'none';
    stopBtn.style.display = 'inline-block';
    recordingStatus.style.display = 'block';
    saveStatus.style.display = 'none';
    
    mediaRecorder.start();
  });

  stopBtn.addEventListener('click', () => {
    if (mediaRecorder && mediaRecorder.state === 'recording') {
      mediaRecorder.stop();
      audioPlayer.pause();
    }
  });

  audioPlayer.addEventListener('ended', () => {
    if (mediaRecorder && mediaRecorder.state === 'recording') {
      stopBtn.click();
    }
  });

  // PARTICLES
  const SNOW_COUNT = 45;
  const snowParticles = Array.from({ length: SNOW_COUNT }, () => ({
    x: Math.random() * 720,
    y: Math.random() * 1280,
    r: Math.random() * 2.2 + 0.6,
    speedY: Math.random() * 0.23 + 0.12,
    speedX: (Math.random() - 0.5) * 0.15,
    opacity: Math.random() * 0.6 + 0.3
  }));

  function updateAndDrawSnow(speedFactor) {
    snowParticles.forEach(p => {
      p.y += p.speedY * speedFactor;
      p.x += p.speedX * speedFactor;
      if (p.y > 1280) { p.y = -5; p.x = Math.random() * 720; }
      if (p.x < 0) p.x = 720;
      if (p.x > 720) p.x = 0;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255, 255, 255, ${p.opacity})`;
      ctx.fill();
    });
  }

  // FLOWERS
  const THEME_PALETTES = {
    rose: ['#E11D48', '#FB7185', '#F43F5E', '#FDA4AF', '#FFFFFF'],
    golden: ['#F59E0B', '#FBBF24', '#FCD34D', '#FEF08A'],
    multi: ['#EF4444', '#FBBF24', '#38BDF8', '#10B981', '#F472B6'],
    sakura: ['#F472B6', '#FBCFE8', '#F9A8D4', '#FFFFFF']
  };

  const FLOWER_COUNT = 15;
  const flowers = Array.from({ length: FLOWER_COUNT }, () => makeFlower());

  function makeFlower(startAtTop) {
    const palette = THEME_PALETTES[flowerThemeSelect.value] || THEME_PALETTES.rose;
    return {
      x: Math.random() * 720,
      y: startAtTop ? -30 - Math.random() * 200 : Math.random() * 1280,
      size: Math.random() * 7 + 8,
      color: palette[Math.floor(Math.random() * palette.length)],
      speedY: Math.random() * 0.28 + 0.20,
      swayFreq: Math.random() * 0.0007 + 0.0003,
      swayPhase: Math.random() * Math.PI * 2,
      rot: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.008,
      opacity: Math.random() * 0.45 + 0.45
    };
  }

  function drawFlowerShape(f) {
    ctx.save();
    ctx.translate(f.x, f.y);
    ctx.rotate(f.rot);
    ctx.globalAlpha = f.opacity;
    for (let i = 0; i < 5; i++) {
      ctx.rotate((Math.PI * 2) / 5);
      ctx.beginPath();
      ctx.ellipse(0, -f.size * 0.6, f.size * 0.42, f.size * 0.62, 0, 0, Math.PI * 2);
      ctx.fillStyle = f.color;
      ctx.shadowBlur = 8;
      ctx.shadowColor = f.color;
      ctx.fill();
    }
    ctx.beginPath();
    ctx.arc(0, 0, f.size * 0.3, 0, Math.PI * 2);
    ctx.fillStyle = '#FFFFFF';
    ctx.fill();
    ctx.restore();
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
  }

  function updateAndDrawFlowers(t, speedFactor) {
    flowers.forEach(f => {
      f.y += f.speedY * speedFactor;
      f.x += Math.sin(t * f.swayFreq + f.swayPhase) * (0.35 * speedFactor);
      f.rot += f.rotSpeed * speedFactor;
      if (f.y > 1280 + 30) {
        Object.assign(f, makeFlower(true));
      }
      drawFlowerShape(f);
    });
  }

  // FLOATING LETTERS / MULTI-LANGUAGE NAME
  const DEFAULT_CHARS = [
    { ch: 'H', font: "'Poppins', sans-serif" }, { ch: 'B', font: "'Poppins', sans-serif" },
    { ch: 'D', font: "'Poppins', sans-serif" }, { ch: '💖', font: "sans-serif" },
    { ch: '✨', font: "sans-serif" }, { ch: '🎂', font: "sans-serif" }
  ];

  // ഓരോ ഭാഷക്കും ഉള്ള ഫോണ്ട് ഫാമിലി
  const LANG_FONTS = {
    en: "'Poppins', sans-serif",
    hi: "'Noto Sans Devanagari', sans-serif",
    ml: "'Noto Sans Malayalam', 'Anek Malayalam', sans-serif",
    ar: "'Noto Sans Arabic', sans-serif"
  };

  // പേരിന്റെ 4 ഭാഷാ വേർഷനുകൾ ഇവിടെ സൂക്ഷിക്കും (Gemini transliteration result)
  let nameVariants = null; // { en, hi, ml, ar }
  let lastTranslitSource = '';

  // API key രണ്ടാമത്തെ തവണ ടൈപ്പ് ചെയ്യേണ്ട, localStorage-ൽ സേവ് ചെയ്യുന്നു
  try {
    const savedKey = localStorage.getItem('paattuGeminiKey');
    if (savedKey) geminiApiKeyInput.value = savedKey;
  } catch (e) {}

  async function transliterateName() {
    const nameTxt = customNameInput.value.trim();
    const apiKey = geminiApiKeyInput.value.trim();
    if (!nameTxt) { translitPreview.textContent = 'ആദ്യം ഒരു പേര് എഴുതുക...'; return; }
    if (!apiKey) { translitPreview.textContent = '⚠️ Gemini API Key വേണം (multi-language glow-നു മാത്രം)'; return; }

    try { localStorage.setItem('paattuGeminiKey', apiKey); } catch (e) {}

    translitBtn.disabled = true;
    translitPreview.textContent = '⏳ Translating...';

    try {
      const prompt = `Transliterate (NOT translate, keep pronunciation same) the name "${nameTxt}" into English, Hindi (Devanagari), Malayalam, and Arabic scripts. Respond ONLY with raw JSON, no markdown, no backticks, in this exact format: {"en":"...","hi":"...","ml":"...","ar":"..."}`;

      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [{ text: prompt }] }]
        })
      });

      if (!response.ok) throw new Error('API error ' + response.status);
      const data = await response.json();
      let text = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
      text = text.replace(/```json|```/g, '').trim();
      const parsed = JSON.parse(text);

      nameVariants = {
        en: (parsed.en || nameTxt).trim(),
        hi: (parsed.hi || '').trim(),
        ml: (parsed.ml || '').trim(),
        ar: (parsed.ar || '').trim()
      };
      lastTranslitSource = nameTxt;
      translitPreview.textContent = `✅ ${nameVariants.en} | ${nameVariants.hi} | ${nameVariants.ml} | ${nameVariants.ar}`;
    } catch (err) {
      translitPreview.textContent = '❌ Translation പരാജയപ്പെട്ടു: ' + err.message;
      nameVariants = null;
    } finally {
      translitBtn.disabled = false;
    }
  }

  translitBtn.addEventListener('click', transliterateName);

  const GLOW_COLORS = ['#38BDF8', '#F472B6', '#FBBF24', '#34D399', '#FB7185', '#FFFFFF'];
  let charSpawnTimer = 0;
  const activeFloatingLetters = [];

  // Malayalam/Hindi/Arabic-ലെ കൂട്ടക്ഷരങ്ങൾ (conjuncts) പൊട്ടാതെ ശരിയായി അക്ഷരം അക്ഷരമായി പിരിക്കാൻ
  function splitGraphemes(str) {
    if (typeof Intl !== 'undefined' && Intl.Segmenter) {
      try {
        const seg = new Intl.Segmenter(undefined, { granularity: 'grapheme' });
        return Array.from(seg.segment(str), s => s.segment);
      } catch (e) {}
    }
    return Array.from(str); // fallback
  }

  function spawnFloatingLetter() {
    let pool = DEFAULT_CHARS;
    const customTxt = customNameInput.value.trim();

    if (customTxt.length > 0) {
      // multi-language transliteration ലഭ്യമാണെങ്കിൽ, 4 ഭാഷകളിലെയും അക്ഷരങ്ങൾ ഓരോന്നായി (A, i, s, w, a...)
      // ഒരു പൊതു pool-ൽ ചേർത്ത് അതിൽ നിന്ന് റാൻഡമായി ഒരു അക്ഷരം ഓരോ തവണയും കാണിക്കുന്നു
      if (nameVariants && lastTranslitSource === customTxt) {
        pool = [];
        ['en', 'hi', 'ml', 'ar'].forEach(langKey => {
          const val = nameVariants[langKey];
          if (!val) return;
          splitGraphemes(val).forEach(g => {
            if (g.trim().length > 0) pool.push({ ch: g, font: LANG_FONTS[langKey] });
          });
        });
        if (pool.length === 0) pool = [{ ch: customTxt, font: "'Poppins', sans-serif" }];
      } else {
        // Transliteration ചെയ്തിട്ടില്ലെങ്കിൽ, ടൈപ്പ് ചെയ്ത പേര് അതേപടി അക്ഷരം അക്ഷരമായി കാണിക്കുന്നു
        const splitChars = splitGraphemes(customTxt.replace(/\s+/g, ''));
        pool = splitChars.map(c => ({ ch: c, font: "'Poppins', sans-serif" }));
      }
    }

    const item = pool[Math.floor(Math.random() * pool.length)];
    activeFloatingLetters.push({
      ch: item.ch,
      font: item.font,
      color: GLOW_COLORS[Math.floor(Math.random() * GLOW_COLORS.length)],
      x: 60 + Math.random() * 600,
      y: 100 + Math.random() * 1050,
      baseY: 0,
      driftX: (Math.random() - 0.5) * 0.12,
      driftY: (Math.random() - 0.5) * 0.08,
      swayFreq: Math.random() * 0.0010 + 0.0004,
      swayPhase: Math.random() * Math.PI * 2,
      swayAmp: 25 + Math.random() * 25,
      pulseFreq: Math.random() * 0.0018 + 0.0009,
      pulsePhase: Math.random() * Math.PI * 2,
      age: 0,
      life: 14000 + Math.random() * 6000,
      fontSize: 26,
      inited: false
    });
  }

  function updateAndDrawLetters(t, deltaTime, speedFactor) {
    for (let i = activeFloatingLetters.length - 1; i >= 0; i--) {
      const l = activeFloatingLetters[i];
      l.age += deltaTime * 1000 * speedFactor;

      if (!l.inited) { l.baseY = l.y; l.inited = true; }

      l.baseY += l.driftY * speedFactor;
      l.x += (l.driftX + Math.sin(t * l.swayFreq + l.swayPhase) * (l.swayAmp * 0.008)) * speedFactor;
      const y = l.baseY + Math.cos(t * l.swayFreq * 0.6 + l.swayPhase) * 8;

      const fadeIn = Math.min(1, l.age / 1400);
      const fadeOut = Math.min(1, Math.max(0, (l.life - l.age) / 2000));
      const pulse = 0.7 + 0.3 * Math.sin(t * l.pulseFreq + l.pulsePhase);
      const opacity = fadeIn * fadeOut * pulse * 0.75;

      if (l.age >= l.life) {
        activeFloatingLetters.splice(i, 1);
        continue;
      }

      ctx.save();
      ctx.translate(l.x, y);
      ctx.globalAlpha = opacity;
      ctx.font = `600 ${l.fontSize}px ${l.font}`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = l.color;
      ctx.shadowBlur = 16 * pulse;
      ctx.fillStyle = l.color;
      ctx.fillText(l.ch, 0, 0);
      ctx.restore();
      ctx.globalAlpha = 1;
    }
  }

  // FLOATING EMOJIS
  let emojiSpawnTimer = 0;
  const activeEmojis = [];

  function spawnEmoji() {
    const rawVal = customEmojisInput.value.trim();
    if (!rawVal) return;
    const emojis = rawVal.split(/\s+/);
    const em = emojis[Math.floor(Math.random() * emojis.length)];

    activeEmojis.push({
      emoji: em,
      x: 50 + Math.random() * 620,
      y: 100 + Math.random() * 1050,
      baseY: 0,
      driftX: (Math.random() - 0.5) * 0.15,
      driftY: - (0.15 + Math.random() * 0.2),
      swayFreq: Math.random() * 0.0012 + 0.0005,
      swayPhase: Math.random() * Math.PI * 2,
      swayAmp: 20 + Math.random() * 20,
      age: 0,
      life: 12000 + Math.random() * 5000,
      size: 24,
      inited: false
    });
  }

  function updateAndDrawEmojis(t, deltaTime, speedFactor) {
    for (let i = activeEmojis.length - 1; i >= 0; i--) {
      const e = activeEmojis[i];
      e.age += deltaTime * 1000 * speedFactor;
      if (!e.inited) { e.baseY = e.y; e.inited = true; }

      e.baseY += e.driftY * speedFactor;
      e.x += (e.driftX + Math.sin(t * e.swayFreq + e.swayPhase) * (e.swayAmp * 0.01)) * speedFactor;
      const y = e.baseY;

      const fadeIn = Math.min(1, e.age / 1200);
      const fadeOut = Math.min(1, Math.max(0, (e.life - e.age) / 1800));
      const opacity = fadeIn * fadeOut * 0.85;

      if (e.age >= e.life || y < -40) {
        activeEmojis.splice(i, 1);
        continue;
      }

      ctx.save();
      ctx.translate(e.x, y);
      ctx.globalAlpha = opacity;
      ctx.font = `${e.size}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowBlur = 10;
      ctx.shadowColor = '#FFD700';
      ctx.fillText(e.emoji, 0, 0);
      ctx.restore();
      ctx.globalAlpha = 1;
    }
  }

  // FLOATING PHOTO BUBBLES
  const floatingPhotos = [];
  function initFloatingPhotos() {
    floatingPhotos.length = 0;
    const sizes = [110, 85, 65, 50];
    for (let i = 0; i < 6; i++) {
      floatingPhotos.push({
        x: Math.random() * 600 + 60,
        y: Math.random() * 1280,
        size: sizes[i % sizes.length],
        speedY: (Math.random() * 0.22 + 0.14),
        driftX: (Math.random() - 0.5) * 0.18,
        swayFreq: Math.random() * 0.0008 + 0.0003,
        swayPhase: Math.random() * Math.PI * 2,
        opacity: Math.random() * 0.25 + 0.45
      });
    }
  }

  function updateAndDrawFloatingPhotos(t, speedFactor) {
    if (!bgImage || bubbleToggleSelect.value === 'no') return;
    
    floatingPhotos.forEach(p => {
      p.y += p.speedY * speedFactor;
      if (p.y > 1280 + p.size) {
        p.y = -p.size;
        p.x = Math.random() * 600 + 60;
      }

      const px = p.x + Math.sin(t * p.swayFreq + p.swayPhase) * 35;
      const py = p.y;
      const r = p.size / 2;

      ctx.save();
      ctx.globalAlpha = p.opacity;
      ctx.translate(px, py);

      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.closePath();
      ctx.clip();

      ctx.drawImage(bgImage, -r, -r, p.size, p.size);
      ctx.restore();

      ctx.save();
      ctx.globalAlpha = p.opacity;
      ctx.translate(px, py);
      ctx.beginPath();
      ctx.arc(0, 0, r + 2, 0, Math.PI * 2);
      ctx.strokeStyle = '#F472B6';
      ctx.lineWidth = 2.5;
      ctx.shadowColor = '#F472B6';
      ctx.shadowBlur = 12;
      ctx.stroke();
      ctx.restore();
      ctx.globalAlpha = 1;
    });
  }

  // FULLSCREEN BACKGROUND PHOTO
  function drawFullscreenPhotoBackground(t) {
    const w = canvas.width;
    const h = canvas.height;

    if (bgImage) {
      const zoom = 1 + 0.03 * Math.sin(t * 0.0004);
      const dw = w * zoom;
      const dh = h * zoom;
      const dx = (w - dw) / 2;
      const dy = (h - dh) / 2;

      const imgRatio = bgImage.width / bgImage.height;
      const canvasRatio = w / h;
      let sx, sy, sWidth, sHeight;

      if (imgRatio > canvasRatio) {
        sHeight = bgImage.height;
        sWidth = bgImage.height * canvasRatio;
        sx = (bgImage.width - sWidth) / 2;
        sy = 0;
      } else {
        sWidth = bgImage.width;
        sHeight = bgImage.width / canvasRatio;
        sx = 0;
        sy = (bgImage.height - sHeight) / 2;
      }

      ctx.drawImage(bgImage, sx, sy, sWidth, sHeight, dx, dy, dw, dh);

      const dimOpacity = (parseInt(bgDimSlider.value) || 45) / 100;
      ctx.fillStyle = `rgba(10, 15, 29, ${dimOpacity})`;
      ctx.fillRect(0, 0, w, h);

      const grad = ctx.createRadialGradient(w / 2, h / 2, w * 0.3, w / 2, h / 2, w * 0.85);
      grad.addColorStop(0, 'transparent');
      grad.addColorStop(1, 'rgba(0, 0, 0, 0.7)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);

    } else {
      const grad = ctx.createLinearGradient(0, 0, w, h);
      grad.addColorStop(0, '#0F172A');
      grad.addColorStop(1, '#020617');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);
    }

    const flares = [
      { cx: w * (0.5 + 0.35 * Math.sin(t * 0.0003)), cy: h * (0.3 + 0.15 * Math.cos(t * 0.0002)), r: 320, c: 'rgba(244,114,182,0.18)' },
      { cx: w * (0.5 + 0.3  * Math.cos(t * 0.0004)), cy: h * (0.7 + 0.12 * Math.sin(t * 0.0003)), r: 280, c: 'rgba(56,189,248,0.15)' },
      { cx: w * (0.5 - 0.2  * Math.sin(t * 0.0002)), cy: h * 0.5,                                   r: 350, c: 'rgba(251,191,36,0.14)' }
    ];
    flares.forEach(b => {
      const rg = ctx.createRadialGradient(b.cx, b.cy, 0, b.cx, b.cy, b.r);
      rg.addColorStop(0, b.c);
      rg.addColorStop(1, 'transparent');
      ctx.fillStyle = rg;
      ctx.fillRect(0, 0, w, h);
    });
  }

  // BIRTHDAY BANNER
  function drawBirthdayWishes(t) {
    const text = birthdayWishInput.value.trim();
    if (!text) return;

    ctx.save();
    const pulse = 1 + 0.04 * Math.sin(t * 0.003);
    ctx.translate(canvas.width / 2, 115);
    ctx.scale(pulse, pulse);

    ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
    ctx.beginPath();
    ctx.roundRect(-270, -28, 540, 56, 28);
    ctx.fill();

    ctx.strokeStyle = 'rgba(251, 191, 36, 0.5)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.font = "bold 30px 'Dancing Script', 'Poppins', cursive";
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = '#FBBF24';
    ctx.shadowBlur = 22;
    ctx.fillStyle = '#FEF08A';
    ctx.fillText(text, 0, 0);

    ctx.restore();
  }

  // RENDER LOOP
  function drawFrame() {
    const now = performance.now();
    const deltaTime = (now - lastTime) / 1000;
    lastTime = now;
    const speedFactor = parseFloat(animSpeedFactor.value) || 1.0;

    // പാട്ട് പ്ലേ ആകുമ്പോൾ മാത്രം സ്ക്രോൾ ആകുന്ന ലോജിക്
    const shouldScroll = !isScrollPaused && scrollSpeed > 0 && !audioPlayer.paused;

    if (shouldScroll) {
      autoScrollY += scrollSpeed * deltaTime * 1.5;
    }

    drawFullscreenPhotoBackground(now);
    updateAndDrawSnow(speedFactor);
    updateAndDrawFlowers(now, speedFactor);

    emojiSpawnTimer += deltaTime * 1000 * speedFactor;
    if (emojiSpawnTimer >= 1400) {
      emojiSpawnTimer = 0;
      spawnEmoji();
    }
    updateAndDrawEmojis(now, deltaTime, speedFactor);

    charSpawnTimer += deltaTime * 1000 * speedFactor;
    if (charSpawnTimer >= 650) {
      charSpawnTimer = 0;
      spawnFloatingLetter();
    }
    updateAndDrawLetters(now, deltaTime, speedFactor);

    updateAndDrawFloatingPhotos(now, speedFactor);
    drawBirthdayWishes(now);

    // ലിറിക്സ് റെൻഡറിങ്
    const startYPos = canvas.height * 0.65;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    lines.forEach((line, index) => {
      const lineY = startYPos + (index * LINE_SPACING) - autoScrollY + manualOffset;
      if (lineY < -60 || lineY > canvas.height + 60) return;

      const centerDist = Math.abs(canvas.height / 2 - lineY);
      const opacity = Math.max(0.08, 1 - centerDist / 700);

      ctx.font = FONT;
      ctx.shadowColor = `rgba(244, 114, 182, ${opacity * 0.8})`;
      ctx.shadowBlur = 12;
      ctx.fillStyle = `rgba(255,255,255,${opacity})`;

      ctx.strokeStyle = `rgba(0,0,0,${opacity * 0.75})`;
      ctx.lineWidth = 3;
      ctx.strokeText(line, canvas.width / 2, lineY);
      ctx.fillText(line, canvas.width / 2, lineY);
      ctx.shadowBlur = 0;
    });

    // FADERS
    const fadeH = 170;
    let tFade = ctx.createLinearGradient(0, 0, 0, fadeH);
    tFade.addColorStop(0, 'rgba(0,0,0,0.85)');
    tFade.addColorStop(1, 'transparent');
    ctx.fillStyle = tFade;
    ctx.fillRect(0, 0, canvas.width, fadeH);

    let bFade = ctx.createLinearGradient(0, canvas.height - fadeH, 0, canvas.height);
    bFade.addColorStop(0, 'transparent');
    bFade.addColorStop(1, 'rgba(0,0,0,0.92)');
    ctx.fillStyle = bFade;
    ctx.fillRect(0, canvas.height - fadeH, canvas.width, fadeH);

    requestAnimationFrame(drawFrame);
  }

  updateLines();
  drawFrame();
</script>
