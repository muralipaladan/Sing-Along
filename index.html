<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pro Lyrics Video Maker</title>
<link href="https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@400;600&family=Manjari:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0F172A; --panel: #1E293B; --accent: #38BDF8; --text: #F8FAFC; --muted: #94A3B8;
  }
  * { box-sizing: border-box; }
  body, html { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: 'Anek Malayalam', sans-serif; height: 100%; }

  /* ===== TOP SECTION: inputs ===== */
  .top-section { max-width: 500px; margin: 0 auto; padding: 10px 12px 0; display: flex; flex-direction: column; gap: 8px; }
  h1 { font-size: 18px; text-align: center; margin: 4px 0; color: var(--accent); }

  .input-group { display: flex; flex-direction: column; gap: 4px; }
  label { font-size: 12px; color: var(--muted); }

  input[type="file"], textarea {
    width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1);
    background: var(--panel); color: var(--text); font-family: inherit; font-size: 13px;
  }
  textarea { height: 70px; resize: none; }

  /* ===== STICKY CONTROL BAR ===== */
  .ctrl-bar {
    position: sticky; top: 0; z-index: 100;
    background: #111827;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    padding: 6px 10px;
    display: flex; flex-direction: column; gap: 5px;
    max-width: 500px; margin: 0 auto;
  }

  /* Row 1: speed */
  .speed-row {
    display: flex; align-items: center; gap: 6px;
  }
  .speed-label { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .speed-val { color: var(--accent); font-weight: bold; font-size: 13px; background: #000; padding: 1px 6px; border-radius: 4px; min-width: 32px; text-align: center; }
  .ico-btn {
    background: var(--panel); border: 1px solid rgba(255,255,255,0.2); color: white;
    width: 32px; height: 30px; border-radius: 5px; font-size: 16px; cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .ico-btn:active { background: rgba(255,255,255,0.15); }
  input[type="range"] { flex: 1; cursor: pointer; accent-color: var(--accent); height: 18px; }

  /* Row 2: action buttons */
  .action-row {
    display: flex; align-items: center; gap: 6px;
  }
  .btn-pause {
    flex: 1;
    background: #374151; color: white; font-weight: 600; border: none; padding: 6px 8px;
    border-radius: 7px; font-size: 12px; cursor: pointer; transition: 0.2s; white-space: nowrap;
  }
  .btn-pause.paused { background: #F59E0B; color: #000; }

  .btn-rec {
    background: var(--accent); color: #000; font-weight: 700; border: none; padding: 6px 12px;
    border-radius: 7px; font-size: 13px; cursor: pointer; white-space: nowrap; flex-shrink: 0;
  }
  .btn-rec:active { transform: scale(0.97); }
  .btn-stop {
    background: #EF4444; color: #fff; font-weight: 700; border: none; padding: 6px 12px;
    border-radius: 7px; font-size: 13px; cursor: pointer; white-space: nowrap; flex-shrink: 0; display: none;
  }

  /* Row 3: audio player */
  .audio-row audio {
    width: 100%; height: 32px;
  }

  /* status */
  .status-row { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 16px; }
  .recording-indicator { color: #EF4444; font-weight: bold; font-size: 12px; display: none; animation: blink 1s infinite; }
  .status { font-size: 12px; color: #10B981; display: none; }
  @keyframes blink { 50% { opacity: 0.4; } }

  /* ===== CANVAS ===== */
  .canvas-wrapper {
    width: 100%; max-width: 500px; margin: 0 auto;
    aspect-ratio: 9/16; background: #000; overflow: hidden;
  }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; outline: none; }
  canvas:active { cursor: grabbing; }
</style>
</head>
<body>

<!-- ===== TOP: File + Lyrics inputs ===== -->
<div class="top-section">
  <h1>🎵 Lyrics Video Maker</h1>

  <div class="input-group">
    <label>പാട്ട് (MP3, MP4, WebM, M4A, Opus)</label>
    <input type="file" id="audioInput" accept="audio/*,video/*,.mp3,.mp4,.webm,.m4a,.opus">
  </div>

  <div class="input-group">
    <label>വരികൾ (Lyrics)</label>
    <textarea id="lyricsInput" placeholder="വരികൾ ഇവിടെ പേസ്റ്റ് ചെയ്യുക..."></textarea>
  </div>
</div>

<!-- ===== STICKY CONTROL BAR ===== -->
<div class="ctrl-bar">

  <!-- Speed row -->
  <div class="speed-row">
    <span class="speed-label">സ്പീഡ്</span>
    <button class="ico-btn" id="btnSlow">−</button>
    <input type="range" id="speedSlider" min="0" max="150" value="40">
    <button class="ico-btn" id="btnFast">+</button>
    <span class="speed-val" id="speedValue">40</span>
  </div>

  <!-- Audio player row -->
  <div class="audio-row">
    <audio id="audioPlayer" crossOrigin="anonymous" controls></audio>
  </div>

  <!-- Action buttons row -->
  <div class="action-row">
    <button id="pauseScrollBtn" class="btn-pause">⏸ സ്ക്രോൾ നിർത്തുക</button>
    <button id="recordBtn" class="btn-rec">🔴 Record</button>
    <button id="stopBtn" class="btn-stop">⏹ Stop</button>
  </div>

  <!-- Status row -->
  <div class="status-row">
    <span id="recordingStatus" class="recording-indicator">● റെക്കോർഡ് ചെയ്യുന്നു...</span>
    <span id="saveStatus" class="status">✅ വീഡിയോ സേവ് ആയി! ഡൗൺലോഡ് നോക്കുക.</span>
  </div>

</div>

<!-- ===== CANVAS ===== -->
<div class="canvas-wrapper">
  <canvas id="videoCanvas" width="720" height="1280" tabindex="0"></canvas>
</div>

<script>
  const audioInput = document.getElementById('audioInput');
  const lyricsInput = document.getElementById('lyricsInput');
  const speedSlider = document.getElementById('speedSlider');
  const speedValue = document.getElementById('speedValue');
  const btnSlow = document.getElementById('btnSlow');
  const btnFast = document.getElementById('btnFast');
  const pauseScrollBtn = document.getElementById('pauseScrollBtn');
  const canvas = document.getElementById('videoCanvas');
  const ctx = canvas.getContext('2d');
  const recordBtn = document.getElementById('recordBtn');
  const stopBtn = document.getElementById('stopBtn');
  const audioPlayer = document.getElementById('audioPlayer');
  const recordingStatus = document.getElementById('recordingStatus');
  const saveStatus = document.getElementById('saveStatus');

  let mediaRecorder;
  let recordedChunks = [];
  let audioCtx, source, dest;
  let lines = [];
  
  let scrollSpeed = parseInt(speedSlider.value);
  let manualOffset = 0; 
  let autoScrollY = 0; 
  let lastTime = performance.now();
  
  let isDragging = false;
  let startY = 0;
  let initialOffset = 0;
  let isScrollPaused = false;

  function updateSpeed(val) {
    scrollSpeed = Math.max(0, Math.min(150, val));
    speedSlider.value = scrollSpeed;
    speedValue.textContent = scrollSpeed;
  }
  
  speedSlider.addEventListener('input', (e) => updateSpeed(parseInt(e.target.value)));
  btnSlow.addEventListener('click', () => updateSpeed(scrollSpeed - 2));
  btnFast.addEventListener('click', () => updateSpeed(scrollSpeed + 2));

  pauseScrollBtn.addEventListener('click', () => {
    isScrollPaused = !isScrollPaused;
    if (isScrollPaused) {
      pauseScrollBtn.textContent = '▶ സ്ക്രോളിംഗ് തുടരുക (Resume)';
      pauseScrollBtn.classList.add('paused');
    } else {
      pauseScrollBtn.textContent = '⏸ മ്യൂസിക് വരുമ്പോൾ സ്ക്രോൾ നിർത്തുക';
      pauseScrollBtn.classList.remove('paused');
    }
  });

  const topSection = document.querySelector('.top-section');
  let songReady = false, lyricsReady = false;

  function checkHideInputs() {
    if (songReady && lyricsReady) {
      topSection.style.transition = 'opacity 0.5s, max-height 0.5s';
      topSection.style.opacity = '0';
      topSection.style.maxHeight = '0';
      topSection.style.overflow = 'hidden';
      topSection.style.padding = '0';
    }
  }

  audioInput.addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file) {
      audioPlayer.src = URL.createObjectURL(file);
      songReady = true;
      checkHideInputs();
    }
  });

  lyricsInput.addEventListener('input', function() {
    lyricsReady = this.value.trim().length > 0;
    checkHideInputs();
    updateLines();
  });

  // Canvas 720px wide displayed ~500px on screen → scale 1.44
  // 16px on screen * 1.44 = ~23px canvas. Use 28px for bold clarity.
  const FONT_SIZE = 30;
  const FONT = "bold " + FONT_SIZE + "px 'Manjari', sans-serif";
  const LINE_SPACING = Math.round(FONT_SIZE * 1.9);

  function updateLines() {
    ctx.font = FONT;
    const rawLines = lyricsInput.value.split('\n');
    lines = [];
    const maxWidth = canvas.width - 60;
    rawLines.forEach(text => {
      if (text.trim() === '') { lines.push(''); return; }
      const words = text.split(' ');
      let cur = words[0] || '';
      for (let i = 1; i < words.length; i++) {
        const test = cur + ' ' + words[i];
        if (ctx.measureText(test).width < maxWidth) { cur = test; }
        else { lines.push(cur); cur = words[i]; }
      }
      if (cur) lines.push(cur);
    });
  }



  function getEventY(e) { return e.touches ? e.touches[0].clientY : e.clientY; }

  function onDragStart(e) {
    isDragging = true;
    startY = getEventY(e);
    initialOffset = manualOffset;
    canvas.focus(); 
  }

  function onDragMove(e) {
    if (!isDragging) return;
    let dy = getEventY(e) - startY;
    let scale = canvas.height / canvas.clientHeight; 
    manualOffset = initialOffset + (dy * scale);
  }

  function onDragEnd() { isDragging = false; }

  canvas.addEventListener('mousedown', onDragStart);
  canvas.addEventListener('mousemove', onDragMove);
  window.addEventListener('mouseup', onDragEnd);
  canvas.addEventListener('mouseleave', () => { isDragging = false; });
  
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    let scale = canvas.height / canvas.clientHeight;
    manualOffset -= (e.deltaY * scale * 1.5);
  }, { passive: false });

  canvas.addEventListener('touchstart', onDragStart, { passive: true });
  canvas.addEventListener('touchmove', onDragMove, { passive: true });
  window.addEventListener('touchend', onDragEnd);
  window.addEventListener('touchcancel', onDragEnd);

  recordBtn.addEventListener('click', async () => {
    if (!audioPlayer.src) {
      alert("ആദ്യം ഒരു പാട്ട് അപ്‌ലോഡ് ചെയ്യുക!");
      return;
    }
    
    updateLines(); 
    manualOffset = 0; 
    autoScrollY = 0;
    lastTime = performance.now();
    isScrollPaused = false;
    pauseScrollBtn.textContent = '⏸ മ്യൂസിക് വരുമ്പോൾ സ്ക്രോൾ നിർത്തുക';
    pauseScrollBtn.classList.remove('paused');
    canvas.focus(); 
    
    try {
        await audioPlayer.play();
    } catch (err) {
        console.error("Audio play failed:", err);
    }
    
    let audioTracks = [];
    if (audioPlayer.captureStream || audioPlayer.mozCaptureStream) {
        const aStream = audioPlayer.captureStream ? audioPlayer.captureStream() : audioPlayer.mozCaptureStream();
        audioTracks = aStream.getAudioTracks();
    }
    
    if (audioTracks.length === 0) {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          source = audioCtx.createMediaElementSource(audioPlayer);
          dest = audioCtx.createMediaStreamDestination();
          source.connect(dest);
          source.connect(audioCtx.destination);
        }
        await audioCtx.resume();
        audioTracks = dest.stream.getAudioTracks();
    }
    
    audioPlayer.currentTime = 0; 
    
    const canvasStream = canvas.captureStream(30); 
    const combinedStream = new MediaStream([
      ...canvasStream.getVideoTracks(),
      ...audioTracks
    ]);
    
    let mimeType = 'video/webm;codecs=vp8,opus';
    if (!MediaRecorder.isTypeSupported(mimeType)) {
        mimeType = MediaRecorder.isTypeSupported('video/mp4') ? 'video/mp4' : 'video/webm';
    }
    
    mediaRecorder = new MediaRecorder(combinedStream, { mimeType: mimeType });
    recordedChunks = [];
    
    mediaRecorder.ondataavailable = e => {
      if (e.data.size > 0) recordedChunks.push(e.data);
    };
    
    mediaRecorder.onstop = () => {
      const blob = new Blob(recordedChunks, { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Lyrics-Video-${Date.now()}.${mimeType.includes('mp4') ? 'mp4' : 'webm'}`;
      a.click();
      
      recordBtn.style.display = 'inline-block';
      stopBtn.style.display = 'none';
      recordingStatus.style.display = 'none';
      saveStatus.style.display = 'block';
      setTimeout(() => saveStatus.style.display = 'none', 4000);
    };
    
    recordBtn.style.display = 'none';
    stopBtn.style.display = 'inline-block';
    recordingStatus.style.display = 'block';
    saveStatus.style.display = 'none';
    
    mediaRecorder.start();
  });

  stopBtn.addEventListener('click', () => {
    if (mediaRecorder && mediaRecorder.state === 'recording') {
      mediaRecorder.stop();
      audioPlayer.pause();
    }
  });

  audioPlayer.addEventListener('ended', () => {
    if (mediaRecorder && mediaRecorder.state === 'recording') {
      stopBtn.click();
    }
  });

  // ===== ANIMATED BACKGROUND PARTICLES =====
  const PARTICLE_COUNT = 55;
  const particles = Array.from({ length: PARTICLE_COUNT }, () => ({
    x: Math.random() * 720,
    y: Math.random() * 1280,
    r: Math.random() * 2.2 + 0.4,
    speed: Math.random() * 0.4 + 0.1,
    opacity: Math.random() * 0.5 + 0.1,
    drift: (Math.random() - 0.5) * 0.3
  }));

  // ===== FALLING FLOWER PETALS (red / yellow / white, drifting like wind) =====
  const FLOWER_COLORS = ['#e63946', '#ffd60a', '#ffffff']; // red, yellow, white
  const FLOWER_COUNT = 14;
  const flowers = Array.from({ length: FLOWER_COUNT }, () => makeFlower());

  function makeFlower(startAtTop) {
    return {
      x: Math.random() * 720,
      y: startAtTop ? -Math.random() * 200 : Math.random() * 1280,
      size: Math.random() * 6 + 7,
      color: FLOWER_COLORS[Math.floor(Math.random() * FLOWER_COLORS.length)],
      speedY: Math.random() * 0.5 + 0.35,
      swayAmp: Math.random() * 18 + 8,
      swayFreq: Math.random() * 0.0009 + 0.0004,
      swayPhase: Math.random() * Math.PI * 2,
      rot: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.02,
      opacity: Math.random() * 0.35 + 0.35
    };
  }

  function drawFlowerShape(f) {
    ctx.save();
    ctx.translate(f.x, f.y);
    ctx.rotate(f.rot);
    ctx.globalAlpha = f.opacity;
    // 5 petals
    for (let i = 0; i < 5; i++) {
      ctx.rotate((Math.PI * 2) / 5);
      ctx.beginPath();
      ctx.ellipse(0, -f.size * 0.6, f.size * 0.42, f.size * 0.62, 0, 0, Math.PI * 2);
      ctx.fillStyle = f.color;
      ctx.fill();
    }
    // center
    ctx.beginPath();
    ctx.arc(0, 0, f.size * 0.28, 0, Math.PI * 2);
    ctx.fillStyle = '#ffe066';
    ctx.fill();
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  function updateAndDrawFlowers(t) {
    flowers.forEach(f => {
      f.y += f.speedY;
      f.x += Math.sin(t * f.swayFreq + f.swayPhase) * 0.6;
      f.rot += f.rotSpeed;
      if (f.y > 1280 + 30) {
        Object.assign(f, makeFlower(true));
      }
      drawFlowerShape(f);
    });
  }

  // ===== SPECIAL NAME-DROP EVENT: "Aiswarya" letters fall one by one every 2 min =====
  const NAME_LETTERS = ['A', 'i', 's', 'w', 'a', 'r', 'y', 'a'];
  const NAME_LETTER_COLORS = ['#ffe066', '#ff6b9d', '#6bcbff', '#9dff6b', '#ff9d6b', '#c06bff', '#ffffff', '#ff4d6d'];
  const NAME_DROP_INTERVAL = 120000; // 2 minutes
  const NAME_LETTER_GAP = 700; // ms between each letter drop
  let nameDropTimer = 0;
  let activeLetters = []; // currently falling name letters
  let firstDropDone = false;
  const FIRST_DROP_DELAY = 10000; // show one 10s after load, so it's visible without waiting 2 min

  function spawnLetterSequence() {
    NAME_LETTERS.forEach((ch, i) => {
      setTimeout(() => {
        activeLetters.push({
          ch,
          color: NAME_LETTER_COLORS[i % NAME_LETTER_COLORS.length],
          x: 80 + Math.random() * 560,
          y: 200 + Math.random() * 700,
          angle: Math.random() * Math.PI * 2,
          turnSpeed: (Math.random() - 0.5) * 0.03,
          speed: Math.random() * 0.5 + 0.4,
          pulsePhase: Math.random() * Math.PI * 2,
          pulseFreq: Math.random() * 0.002 + 0.0015,
          age: 0,
          life: 9000 + Math.random() * 3000, // ~9-12s of flying around
          opacity: 0
        });
      }, i * NAME_LETTER_GAP);
    });
  }

  function updateAndDrawNameLetters(t, deltaTime) {
    for (let i = activeLetters.length - 1; i >= 0; i--) {
      const l = activeLetters[i];
      l.age += deltaTime * 1000;

      // Firefly-like wandering: gently curving random walk
      l.angle += l.turnSpeed;
      l.x += Math.cos(l.angle) * l.speed;
      l.y += Math.sin(l.angle) * l.speed;

      // Bounce off edges so it stays roaming the screen
      if (l.x < 40 || l.x > 680) l.angle = Math.PI - l.angle;
      if (l.y < 120 || l.y > 1160) l.angle = -l.angle;
      l.x = Math.max(30, Math.min(690, l.x));
      l.y = Math.max(100, Math.min(1180, l.y));

      // Fade in, hold, fade out over its lifetime
      const fadeIn = Math.min(1, l.age / 800);
      const fadeOut = Math.min(1, Math.max(0, (l.life - l.age) / 1000));
      const pulse = 0.75 + 0.25 * Math.sin(t * l.pulseFreq + l.pulsePhase);
      l.opacity = fadeIn * fadeOut * pulse;

      if (l.age >= l.life) { activeLetters.splice(i, 1); continue; }

      ctx.save();
      ctx.translate(l.x, l.y);
      ctx.globalAlpha = l.opacity;
      ctx.font = "bold 34px 'Manjari', sans-serif";
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = l.color;
      ctx.shadowBlur = 24 * pulse;
      ctx.fillStyle = l.color;
      ctx.fillText(l.ch, 0, 0);
      ctx.restore();
      ctx.globalAlpha = 1;
    }
  }

  // Color palette for gradient bg — cycles through 3 moods
  const BG_PALETTES = [
    ['#0d0221', '#1a0533', '#0a1045', '#041230'],  // deep violet-navy
    ['#0f2027', '#203a43', '#2c5364', '#0d1b2a'],  // teal-dark
    ['#1a0000', '#2d0a2e', '#0a001f', '#0d1a00'],  // maroon-purple
  ];
  let palIdx = 0, palT = 0;

  function lerpColor(a, b, t) {
    const ah = parseInt(a.slice(1), 16);
    const bh = parseInt(b.slice(1), 16);
    const ar = (ah >> 16) & 0xff, ag = (ah >> 8) & 0xff, ab = ah & 0xff;
    const br = (bh >> 16) & 0xff, bg = (bh >> 8) & 0xff, bb = bh & 0xff;
    const rr = Math.round(ar + (br - ar) * t);
    const rg = Math.round(ag + (bg - ag) * t);
    const rb = Math.round(ab + (bb - ab) * t);
    return `rgb(${rr},${rg},${rb})`;
  }

  function drawAnimatedBg(t) {
    const w = canvas.width, h = canvas.height;
    // Slowly cycle palette
    palT += 0.0008;
    if (palT >= 1) { palT = 0; palIdx = (palIdx + 1) % BG_PALETTES.length; }
    const nextIdx = (palIdx + 1) % BG_PALETTES.length;
    const pal = BG_PALETTES[palIdx].map((c, i) => lerpColor(c, BG_PALETTES[nextIdx][i], palT));

    // Main gradient
    const grad = ctx.createLinearGradient(0, 0, w, h);
    grad.addColorStop(0,    pal[0]);
    grad.addColorStop(0.35, pal[1]);
    grad.addColorStop(0.65, pal[2]);
    grad.addColorStop(1,    pal[3]);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);

    // Animated radial glow blobs
    const blobs = [
      { cx: w * (0.5 + 0.35 * Math.sin(t * 0.0004)), cy: h * (0.3 + 0.15 * Math.cos(t * 0.0003)), r: 320, c: 'rgba(120,60,200,0.13)' },
      { cx: w * (0.5 + 0.3  * Math.cos(t * 0.0005)), cy: h * (0.7 + 0.12 * Math.sin(t * 0.0004)), r: 280, c: 'rgba(30,180,220,0.10)' },
      { cx: w * (0.5 - 0.2  * Math.sin(t * 0.0003)), cy: h * 0.5,                                   r: 350, c: 'rgba(255,80,120,0.07)' },
    ];
    blobs.forEach(b => {
      const rg = ctx.createRadialGradient(b.cx, b.cy, 0, b.cx, b.cy, b.r);
      rg.addColorStop(0, b.c);
      rg.addColorStop(1, 'transparent');
      ctx.fillStyle = rg;
      ctx.fillRect(0, 0, w, h);
    });

    // Particles (floating stars)
    particles.forEach(p => {
      p.y -= p.speed;
      p.x += p.drift;
      if (p.y < -5) { p.y = h + 5; p.x = Math.random() * w; }
      if (p.x < 0 || p.x > w) p.x = Math.random() * w;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${p.opacity})`;
      ctx.fill();
    });
  }

  function drawFrame() {
    const now = performance.now();
    const deltaTime = (now - lastTime) / 1000;
    lastTime = now;

    if (!audioPlayer.paused && !isScrollPaused) {
      autoScrollY += scrollSpeed * deltaTime * 1.5;
    }

    // Draw animated background
    drawAnimatedBg(now);

    // Falling flower petals (red/yellow/white, drifting in wind)
    updateAndDrawFlowers(now);

    // Every 2 minutes, drop the letters of "Aiswarya" one by one
    // (first one fires early at 10s so it's visible without waiting)
    nameDropTimer += deltaTime * 1000;
    if (!firstDropDone && nameDropTimer >= FIRST_DROP_DELAY) {
      firstDropDone = true;
      nameDropTimer = 0;
      spawnLetterSequence();
    } else if (firstDropDone && nameDropTimer >= NAME_DROP_INTERVAL) {
      nameDropTimer = 0;
      spawnLetterSequence();
    }
    updateAndDrawNameLetters(now, deltaTime);

    const startYPos = canvas.height * 0.65;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    lines.forEach((line, index) => {
      const lineY = startYPos + index * LINE_SPACING - autoScrollY + manualOffset;
      if (lineY < -60 || lineY > canvas.height + 60) return;

      const centerDist = Math.abs(canvas.height / 2 - lineY);
      const opacity = Math.max(0.08, 1 - centerDist / 700);

      ctx.font = FONT;

      // No highlight — every line rendered the same way, scroll only
      ctx.shadowColor = `rgba(100,180,255,${opacity * 0.6})`;
      ctx.shadowBlur = 8;
      ctx.fillStyle = `rgba(255,255,255,${opacity})`;

      // Subtle text stroke for depth
      ctx.strokeStyle = `rgba(0,0,0,${opacity * 0.5})`;
      ctx.lineWidth = 2;
      ctx.strokeText(line, canvas.width / 2, lineY);
      ctx.fillText(line, canvas.width / 2, lineY);
      ctx.shadowBlur = 0;
    });

    // Top & bottom fade masks
    const fadeH = 200;
    let tFade = ctx.createLinearGradient(0, 0, 0, fadeH);
    tFade.addColorStop(0, 'rgba(0,0,0,0.95)');
    tFade.addColorStop(1, 'transparent');
    ctx.fillStyle = tFade;
    ctx.fillRect(0, 0, canvas.width, fadeH);

    let bFade = ctx.createLinearGradient(0, canvas.height - fadeH, 0, canvas.height);
    bFade.addColorStop(0, 'transparent');
    bFade.addColorStop(1, 'rgba(0,0,0,0.95)');
    ctx.fillStyle = bFade;
    ctx.fillRect(0, canvas.height - fadeH, canvas.width, fadeH);

    requestAnimationFrame(drawFrame);
  }

  drawFrame();
</script>
